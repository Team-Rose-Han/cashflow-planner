<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cashflow Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div id="gate" class="wrap gate" hidden>
  <form class="box" id="gateform">
    <div class="brandline">
      <img class="logo" src="logo.png" alt="30 Minute Money" width="638" height="240">
      <span class="divider" aria-hidden="true"></span>
      <h1 class="h-display">Cashflow Planner</h1>
    </div>
    <p class="lede">This tool is for members. Enter the access code from the community page to continue.</p>
    <label class="eyebrow" for="code">Access code</label>
    <div class="textrow"><input id="code" type="text" autocomplete="off" autocapitalize="characters" placeholder="Enter code"><button class="btn" type="submit">Unlock</button></div>
    <p class="err" id="gateerr" aria-live="polite"></p>
  </form>
</div>

<main id="app" class="wrap" hidden>
  <header class="top">
    <div class="titles">
      <div class="brandline">
        <img class="logo" src="logo.png" alt="30 Minute Money" width="638" height="240">
        <span class="divider" aria-hidden="true"></span>
        <h1 class="h-display">Cashflow Planner</h1>
      </div>
      <p class="lede" id="tagline"></p>
    </div>
    <button class="btn ghost small" id="restart" hidden>Start over</button>
  </header>

  <nav class="progress" id="progress" aria-label="Steps" hidden></nav>

  <div class="stage">
    <!-- One screen at a time: a few questions, then one screen per bucket, then the balance check, then the plan. -->
    <section class="panel" id="panel" aria-live="polite" hidden></section>

    <section class="plan-card" id="plancard" hidden>
      <div class="plan-head">
        <div>
          <div class="combo" id="plantitle">Your Updated Money Flywheel Map</div>
          <p class="lede" id="plansub"></p>
        </div>
        <div class="actions" id="planactions">
          <button class="btn coral" id="png">Download as PNG</button>
          <button class="btn" id="csv">Download spreadsheet (CSV)</button>
          <button class="btn ghost" id="copy">Copy for Google Sheets</button>
          <button class="btn ghost" id="print">Print</button>
        </div>
      </div>
      <div id="plan"></div>
      <div class="nav plannav" id="plannav"></div>
    </section>
  </div>
  <p class="footnote" id="footnote"></p>
</main>

<div id="overlay" class="overlay" hidden>
  <div class="sheet">
    <div class="nav"><span class="eyebrow">Your plan</span><div class="actions"><a class="btn" id="dl" download="my-money-flywheel-map.png" href="#">Save PNG</a><button class="btn ghost" id="close">Close</button></div></div>
    <img id="shot" alt="Your cashflow plan">
    <p class="footnote">On a phone, press and hold the image to save it.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js?v=3"></script>
<script src="plan.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
